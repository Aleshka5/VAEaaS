[project]
name = "vaeaas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "requests>=2.32.0",
    "pydantic-settings>=2.6.1",
    "torch",
    "torchvision",
    "matplotlib",
    "pillow",
    "safetensors",
    "huggingface-hub",
    "transformers>=4.41",
    "accelerate>=1.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "mlflow>=3.11.1",
    "boto3>=1.42.96",
    "torchserve>=0.12.0",
    "torch-model-archiver>=0.12.0",
    "nvgpu>=0.10.0",
    "nvidia-ml-py>=13.595.45",
    "av>=17.0.1",
    "uvicorn>=0.35.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "mlflow[auth]>=3.11.1",
]
